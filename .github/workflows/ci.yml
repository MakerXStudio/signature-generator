name: Test and Build

# On a pull request to main, run the checks and build.
on:
  pull_request:
    branches:
      - main

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v2
        with:
          persist-credentials: false

      - name: Install Node 🔧
        uses: actions/setup-node@v2
        with:
          node-version-file: .nvmrc

      - name: Install Packages
        run: npm ci

      - run: npm run build
        env:
          CI: true
