version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 3
    groups:
      production:
        dependency-type: production
        update-types:
          - minor
          - patch
      development:
        dependency-type: development
        update-types:
          - minor
          - patch
    # `typescript` (TS 6, for typescript-eslint) and `@typescript/native`
    # (TS 7, provides `tsc`) are npm aliases, which Dependabot skips today,
    # so bump them by hand. These entries are a guard so the TS 6 line used
    # by typescript-eslint is not moved to a new major.
    ignore:
      - dependency-name: typescript
        update-types:
          - version-update:semver-major
      - dependency-name: '@typescript/typescript6'
        update-types:
          - version-update:semver-major

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 3
