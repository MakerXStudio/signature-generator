version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      production:
        dependency-type: production
      development:
        dependency-type: development
    # TypeScript is installed twice through npm aliases: `@typescript/native`
    # (TS 7, provides `tsc`) and `typescript` (TS 6, for typescript-eslint).
    # Dependabot skips `npm:` alias entries, so update both by hand.
    # If Dependabot starts updating them, this rule keeps `typescript` on a
    # major that typescript-eslint supports.
    ignore:
      - dependency-name: typescript
        update-types:
          - version-update:semver-major

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
